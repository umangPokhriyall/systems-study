[package]
name = "toy-uffd-raw"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Demand paging with userfaultfd, built on the raw syscall and hand-encoded ioctls."

[dependencies]
# libc and nothing else. The ioctl numbers are computed from the kernel's _IOC encoding rather than
# imported, so the ABI is visible rather than assumed.
libc = "0.2"
