[package]
name = "toy-kvm-crates"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The same VMM as toy-kvm-raw, rebuilt on kvm-ioctls and vm-memory, to show exactly what those crates add."

[dependencies]
kvm-bindings = "0.14.1"
kvm-ioctls = "0.25.0"
toy-kvm-raw = { version = "0.1.0", path = "../toy-kvm-raw" }
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
