[package]
name = "toy-virtq-crates"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The device half of the same virtqueue, rebuilt on virtio-queue and vm-memory."

[dependencies]
virtio-queue = { version = "0.18.0", features = ["test-utils"] }
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
